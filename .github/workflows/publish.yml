name: Publish

# Runs on a vX.Y.Z tag: started by release.yml (workflow_dispatch on the tag it just pushed, since
# its GITHUB_TOKEN tag push can't start workflows itself), or by a person pushing a tag by hand.
# Checks the tag and changelog, re-runs the CI gate on the tagged commit (a tag can point at any
# commit, not only one CI already passed), then:
#   - pub-dev: publishes to pub.dev
#   - github-release: then creates the GitHub Release from that version's CHANGELOG.md section
# Each checks what already exists and only does what's missing, so "Re-run failed jobs" is the fix
# for a failed run. Don't delete the tag to retry.
#
# Auth: pub.dev automated publishing (OIDC). No token or secret. dart-lang/setup-dart exchanges this
# job's GitHub OIDC token (id-token: write) for a short-lived pub.dev credential. pub.dev only
# accepts it from a run on a tag that matches the pattern set on the package's Admin tab
# (`v{{version}}`), in the `pub.dev` environment that the Admin tab requires, and from a
# workflow_dispatch run only with "Enable publishing from workflow_dispatch events" ticked there.
#
# pub.dev has no staging like npm's: a published version is live at once, and can only be retracted
# (within 7 days), never deleted. The human gate is the `pub.dev` GitHub environment's required
# reviewers. The pub-dev job waits for one of them to approve it under this run's summary page.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check tag and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tag matches pubspec.yaml
        id: version
        run: |
          # A manual dispatch can pick any branch; only a tag may publish (pub.dev refuses others
          # anyway, but only at the very end).
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a vX.Y.Z tag, not the branch $GITHUB_REF_NAME"
            exit 1
          fi
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify CHANGELOG.md has a section for it
        # Checked here, before anything ships, rather than only when github-release builds the
        # notes: a pub.dev version can't be unpublished, so a missing section must stop it first.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" < CHANGELOG.md > /dev/null

  verify:
    # The same gate as every PR, called rather than copied so the two can't drift.
    uses: ./.github/workflows/ci.yml

  pub-dev-check:
    name: Check pub.dev for this version
    # Outside the pub.dev environment, so finding the version already published (a re-run after a
    # failed GitHub Release, a tag pushed by hand for a published version) needs no approval.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.lookup.outputs.published }}
    steps:
      - name: Look up the version on pub.dev
        id: lookup
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/suqo_checkout/versions/${VERSION}")
          case "$STATUS" in
            200)
              echo "::notice::suqo_checkout ${VERSION} is already on pub.dev — skipping the publish."
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Couldn't check pub.dev for suqo_checkout ${VERSION} (HTTP ${STATUS})"
              exit 1 ;;
          esac

  pub-dev:
    name: Publish to pub.dev
    needs: [check, verify, pub-dev-check]
    if: needs.pub-dev-check.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Before flutter-action: setup-dart is what fetches the OIDC token and registers it with pub,
      # and `flutter pub publish` picks it up from the shared pub config.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Publish
        run: flutter pub publish --force

  github-release:
    name: GitHub Release
    # After pub-dev, so there's never a GitHub Release for a version that isn't installable (a
    # rejected approval, a failed publish). When pub.dev already had the version, pub-dev is skipped
    # and this still runs, so a re-run creates a missing Release without a new approval.
    needs: [check, verify, pub-dev-check, pub-dev]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.verify.result == 'success' &&
      (needs.pub-dev.result == 'success' ||
       (needs.pub-dev.result == 'skipped' && needs.pub-dev-check.outputs.published == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release if it's missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" < CHANGELOG.md > .release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file .release-notes.md
